<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">

<title>Allenamento 43 · V3.6 Premium</title>
<style>
:root{--bg:#f4f0e8;--card:#fffdfa;--navy:#0a2441;--navy2:#173b63;--gold:#d8b355;--line:#e4ddd0;--muted:#6b7280;--text:#17212b;}
*{box-sizing:border-box} html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
body{padding-bottom:88px}
.header{background:linear-gradient(135deg,#09203b,#0e3157 60%,#143d69);color:#fff;padding:16px 18px 18px;position:sticky;top:0;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.12)}
.topbar{display:flex;align-items:center;gap:14px} .logo{width:54px;height:54px;border-radius:16px;border:1px solid rgba(216,179,85,.35);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;color:#f4d987;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.brand small{display:block;color:#e7d49f;font-size:10px;letter-spacing:.18em;font-weight:700} .brand strong{display:block;font-size:20px;line-height:1.15}
.week{margin-left:auto;border:1px solid rgba(216,179,85,.4);color:#f5df9c;border-radius:999px;padding:12px 14px;font-weight:700;font-size:13px}
main{padding:18px 16px 0;max-width:860px;margin:0 auto}
.hero{background:linear-gradient(135deg,#0a2751,#0d3664 70%,#14436f);color:#fff;border-radius:28px;padding:20px;box-shadow:0 18px 35px rgba(10,36,65,.15);position:relative;overflow:hidden}
.hero:after{content:'';position:absolute;right:-40px;bottom:-40px;width:180px;height:180px;border:1px solid rgba(255,255,255,.1);border-radius:50%}
.kicker{color:#f1d98f;font-size:11px;letter-spacing:.2em;font-weight:800;margin-bottom:8px} .hero h1{margin:0 0 4px;font-size:28px} .hero p{margin:0 0 18px;font-size:16px;color:#eef3f8}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px} .stat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.07);border-radius:18px;padding:14px 16px} .stat b{display:block;font-size:19px;color:#fff;margin-bottom:4px} .stat span{font-size:12px;color:#cad8ea;letter-spacing:.08em}
.btn{appearance:none;border:none;border-radius:20px;padding:18px 20px;font-weight:800;font-size:18px;cursor:pointer} .btn-primary{width:100%;background:linear-gradient(180deg,#e3c364,#d4ad43);color:#1f2024;box-shadow:0 8px 16px rgba(212,173,67,.3)} .btn-secondary{background:#fff;color:var(--navy);border:1px solid var(--line)} .btn-ghost{background:#eff3f7;color:var(--navy)}
.section{margin:22px 0} .section-head{display:flex;justify-content:space-between;align-items:end;margin:0 4px 12px} .section-head h2{font-size:18px;margin:0;color:var(--navy)} .section-head span{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;box-shadow:0 6px 20px rgba(17,24,39,.04)}
.progress-bar{height:16px;border-radius:999px;background:#ebe5d8;overflow:hidden} .progress-fill{height:100%;background:linear-gradient(90deg,#e1c15a,#cda547)}
.exercise-card{display:grid;grid-template-columns:120px 1fr;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:14px;margin-bottom:14px;box-shadow:0 8px 22px rgba(17,24,39,.04)}
.exercise-card img{width:120px;height:120px;object-fit:contain;border-radius:18px;border:1px solid var(--line);background:#fff}
.ex-meta h3{margin:0 0 8px;font-size:20px;color:var(--navy)} .chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px} .chip{background:#f3efe5;border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:12px;font-weight:700;color:#4b5563} .note{margin:0 0 10px;color:#425164;line-height:1.4}
.series{display:flex;gap:8px;flex-wrap:wrap} .series button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px;font-weight:800} .series button.done{background:#d9b65a;color:#1e2330;border-color:#d9b65a}
.placeholder{width:120px;height:120px;border-radius:18px;border:1px dashed #c8c1b1;background:linear-gradient(135deg,#faf7ef,#f2ece0);display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;color:#7b7466;font-size:12px;font-weight:700}
.day-list button{width:100%;text-align:left;border:none;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 16px;display:flex;align-items:center;gap:14px;margin-bottom:12px} .day-num{width:36px;height:36px;border-radius:12px;background:#0b2341;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800} .day-main b{display:block;font-size:16px;color:var(--navy)} .day-main small{color:var(--muted)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#081f3c;color:#fff;display:grid;grid-template-columns:repeat(4,1fr);padding:10px 6px calc(10px + env(safe-area-inset-bottom));z-index:30} .bottom-nav button{border:none;background:transparent;color:#b9c6d8;font-weight:700;padding:10px 4px} .bottom-nav button.active{color:#f4d57d}
.overlay{position:fixed;inset:0;background:rgba(4,14,27,.58);backdrop-filter: blur(5px);display:none;align-items:end;justify-content:center;z-index:50} .overlay.show{display:flex}
.sheet{background:#fbf8f1;border-radius:28px 28px 0 0;padding:18px;max-width:860px;width:100%;max-height:92vh;overflow:auto}
.guide-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px} .close{border:none;background:#ece8dd;width:40px;height:40px;border-radius:12px;font-size:24px}
.guide-hero img{width:100%;max-height:420px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:22px;margin-bottom:14px} .guide-hero .placeholder{width:100%;height:240px}
.guide-title{font-size:28px;margin:0;color:var(--navy)} .sub{margin:6px 0 14px;color:#54606f}
.guide-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px} .guide-grid .stat{background:#fff;border:1px solid var(--line)} .guide-grid .stat b{color:var(--navy)} .guide-grid .stat span{color:#64748b}
.big-btn{width:100%;padding:18px 20px;font-size:20px;font-weight:900;border-radius:20px;background:linear-gradient(180deg,#e3c364,#d4ad43);border:none;color:#1f2024;margin-top:10px} .secondary-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.timer-sheet{text-align:center} .timer-sheet h3{margin:0 0 6px;color:var(--navy)} .clock{font-size:58px;font-weight:900;color:var(--navy);margin:20px 0} .small{font-size:13px;color:var(--muted)}
.summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (max-width:580px){.exercise-card{grid-template-columns:1fr} .exercise-card img,.placeholder{width:100%;height:260px} .hero h1{font-size:24px} .brand strong{font-size:18px}}

.sprite-img{background-repeat:no-repeat;background-size:500% 400%;background-color:#fff;border:1px solid var(--line);border-radius:18px;aspect-ratio:4/5;width:100%}.exercise-card .sprite-img{width:120px;height:150px}.guide-hero .sprite-img{width:100%;max-width:430px;margin:0 auto 14px;aspect-ratio:4/5;border-radius:22px}@media(max-width:580px){.exercise-card .sprite-img{width:100%;height:auto;aspect-ratio:4/5}}
</style>

const SPRITE_MAP={"90-90.webp": [0, 0], "bird-dog.webp": [1, 0], "breathing.webp": [2, 0], "calf-raise.webp": [3, 0], "calf-stretch.webp": [4, 0], "dead-bug.webp": [0, 1], "glute-bridge.webp": [1, 1], "hip-flexor-stretch.webp": [2, 1], "march.webp": [3, 1], "mountain-climber.webp": [4, 1], "pike-pushup.webp": [0, 2], "plank.webp": [1, 2], "prone-w-raise.webp": [2, 2], "pushup-incline.webp": [3, 2], "reverse-lunge.webp": [4, 2], "reverse-snow-angel.webp": [0, 3], "squat-chair.webp": [1, 3], "thoracic-rotation.webp": [2, 3], "wall-sit.webp": [3, 3]};
const state = {route:'home', selectedDay:null, week:Number(localStorage.getItem('a43_week')||1), logs:JSON.parse(localStorage.getItem('a43_logs')||'{}'), series:JSON.parse(localStorage.getItem('a43_series')||'{}'), profile:JSON.parse(localStorage.getItem('a43_profile')||'{"age":43,"height":172,"weight":70}'), guide:null};
const app=document.getElementById('app');
const headWeek=document.getElementById('headWeek');
const guideOverlay=document.getElementById('guideOverlay');
const guideKicker=document.getElementById('guideKicker');
const guideTitle=document.getElementById('guideTitle');
const guideSub=document.getElementById('guideSub');
const guideContent=document.getElementById('guideContent');
const timerOverlay=document.getElementById('timerOverlay');
const timerClock=document.getElementById('timerClock');
const timerExercise=document.getElementById('timerExercise');
const timerNext=document.getElementById('timerNext');
let timerInt=null, timerEnd=0, timerRemaining=0, timerPaused=false, pendingAdvance=null;
function save(){localStorage.setItem('a43_week', state.week); localStorage.setItem('a43_logs', JSON.stringify(state.logs)); localStorage.setItem('a43_series', JSON.stringify(state.series)); localStorage.setItem('a43_profile', JSON.stringify(state.profile));}
function todayId(){const ids=['sunday','monday','tuesday','wednesday','thursday','friday','saturday']; return ids[new Date().getDay()]}
function todayPlan(){return DAYS.find(d=>d.id===todayId()) || DAYS[0]}
function currentDay(){return state.selectedDay ? DAYS.find(d=>d.id===state.selectedDay) : todayPlan()}
function keyFor(dayId, exIndex, setIndex){return `${dayId}::${state.week}::${exIndex}::${setIndex}`}
function dayCompletion(day){if(!day.exercises.length) return 0; let total=0, done=0; day.exercises.forEach((ex,i)=>{const sets=parseSets(ex[1]); total+=sets; for(let s=0;s<sets;s++) if(state.series[keyFor(day.id,i,s)]) done++;}); return total?Math.round(done/total*100):0;}
function parseSets(v){const m=String(v).match(/\d+/); return m?Number(m[0]):1}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function weekCopy(w){return [null,'Impara la tecnica e mantieni RPE 5–6.','Consolida: aggiungi 1–2 ripetizioni se il movimento è pulito.','Piccolo sovraccarico: ritmo controllato e RPE 6–7.','Stabilizza il volume e chiudi bene la settimana.'][w]}
function setRoute(r){state.route=r; render(); document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.toggle('active',b.dataset.route===r));}
function exImage(ex){return ex[5]||''}
function spriteBox(name,extra=''){const p=SPRITE_MAP[name];if(!p)return '<div class=\"placeholder\">Immagine non disponibile</div>';const x=p[0]*25,y=p[1]*(100/3);return `<div class=\"sprite-img ${extra}\" role=\"img\" aria-label=\"Scheda esercizio\" style=\"background-image:url('${SPRITE_URI}');background-position:${x}% ${y}%\"></div>`}
function exCard(day, ex, i){const img=exImage(ex); const sets=parseSets(ex[1]); const buttons=[...Array(sets)].map((_,s)=>`<button class="${state.series[keyFor(day.id,i,s)]?'done':''}" data-day="${day.id}" data-ex="${i}" data-set="${s}">Serie ${s+1}</button>`).join(''); return `<article class="exercise-card">${img?spriteBox(img,'card-art'):`<div class="placeholder">Immagine start/end<br>in arrivo</div>`}<div class="ex-meta"><h3>${escapeHtml(ex[0])}</h3><div class="chips"><span class="chip">${escapeHtml(ex[1])} serie</span><span class="chip">${escapeHtml(ex[2])}</span><span class="chip">Rec. ${escapeHtml(ex[3])}</span></div><p class="note">${escapeHtml(ex[4])}</p><div class="series">${buttons}</div></div></article>`;}
function renderHome(){const day=currentDay(); const pct=dayCompletion(day); headWeek.textContent=`SETT. ${state.week}`; const today=new Date().toLocaleDateString('it-IT', {weekday:'long', day:'numeric', month:'long'}).toUpperCase(); app.innerHTML=`<section class="hero"><div class="kicker">OGGI · ${today}</div><h1>${escapeHtml(day.name)}</h1><p>${escapeHtml(day.title)}</p><div class="stats"><div class="stat"><b>${day.duration}</b><span>DURATA</span></div><div class="stat"><b>${day.exercises.length}</b><span>ESERCIZI</span></div><div class="stat"><b>${pct}%</b><span>COMPLETATO</span></div></div>${day.exercises.length?'<button class="btn btn-primary" id="startGuide">▶ AVVIA ALLENAMENTO GUIDATO</button>':'<div class="card" style="color:#eef3f8;background:rgba(255,255,255,.08)">Domenica di riposo. Puoi fare solo una passeggiata leggera o recupero libero.</div>'}</section><section class="section"><div class="section-head"><h2>Avanzamento di oggi</h2><span>${Object.keys(state.logs).length} giornate registrate</span></div><div class="card"><div style="display:flex;justify-content:space-between;font-weight:800;color:var(--navy);margin-bottom:12px"><span>${escapeHtml(day.focus)}</span><span>${pct}%</span></div><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div></div></section><section class="section"><div class="section-head"><h2>Esercizi</h2><span>Tocca le serie per segnarle</span></div>${day.exercises.map((ex,i)=>exCard(day,ex,i)).join('') || '<div class="card">Nessun esercizio previsto oggi.</div>'}</section>`; bindExerciseButtons(); const b=document.getElementById('startGuide'); if(b) b.onclick=()=>openGuide(day.id,0);}
function renderWeek(){headWeek.textContent=`SETT. ${state.week}`; app.innerHTML=`<section class="section"><div class="section-head"><h2>Programma settimanale</h2><span>Settimana ${state.week}</span></div><div class="card"><b>${weekCopy(state.week)}</b></div></section><section class="section"><div class="day-list">${DAYS.map((d,i)=>`<button data-day="${d.id}"><div class="day-num">${i+1}</div><div class="day-main"><b>${escapeHtml(d.name)}</b><small>${escapeHtml(d.title)} · ${escapeHtml(d.duration)}</small></div><div style="margin-left:auto;color:#9aa5b1;font-weight:800">${dayCompletion(d)}%</div></button>`).join('')}</div></section><section class="section"><div class="section-head"><h2>Progressione</h2><span>Tocca la settimana</span></div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">${[1,2,3,4].map(w=>`<button class="btn ${w===state.week?'btn-primary':'btn-secondary'}" style="padding:12px 8px;font-size:14px" data-week="${w}">Sett. ${w}</button>`).join('')}</div></section>`; app.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{state.selectedDay=b.dataset.day; setRoute('home')}); app.querySelectorAll('[data-week]').forEach(b=>b.onclick=()=>{state.week=Number(b.dataset.week); save(); renderWeek();});}
function renderProgress(){headWeek.textContent=`SETT. ${state.week}`; const items=DAYS.filter(d=>d.exercises.length).map(d=>`<div class="card" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;margin-bottom:10px"><b>${escapeHtml(d.name)}</b><span>${dayCompletion(d)}%</span></div><div class="progress-bar"><div class="progress-fill" style="width:${dayCompletion(d)}%"></div></div></div>`).join(''); const complete=DAYS.filter(d=>d.exercises.length).reduce((a,d)=>a+(dayCompletion(d)===100?1:0),0); const avg=Math.round(DAYS.filter(d=>d.exercises.length).reduce((a,d)=>a+dayCompletion(d),0)/6); app.innerHTML=`<section class="section"><div class="section-head"><h2>Progressi</h2><span>Settimana ${state.week}</span></div><div class="summary-grid"><div class="card"><b style="font-size:30px;color:var(--navy)">${complete}</b><div>giornate completate</div></div><div class="card"><b style="font-size:30px;color:var(--navy)">${avg}%</b><div>media settimanale</div></div></div><div class="section">${items}</div></section>`;}
function renderProfile(){headWeek.textContent=`SETT. ${state.week}`; app.innerHTML=`<section class="section"><div class="section-head"><h2>Profilo</h2><span>Dati base</span></div><div class="card"><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px"><label>Età<input id="age" type="number" value="${state.profile.age}" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:14px;margin-top:8px"></label><label>Altezza<input id="height" type="number" value="${state.profile.height}" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:14px;margin-top:8px"></label><label>Peso<input id="weight" type="number" value="${state.profile.weight}" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:14px;margin-top:8px"></label></div><button class="btn btn-primary" id="saveProfile" style="margin-top:14px">Salva profilo</button></div></section><section class="section"><div class="card"><b>Novità V3.6</b><p>Le immagini degli esercizi sono in qualità premium e mostrano posizione iniziale e finale per aiutare a capire meglio il movimento.</p></div></section>`; document.getElementById('saveProfile').onclick=()=>{state.profile.age=Number(age.value||43); state.profile.height=Number(height.value||172); state.profile.weight=Number(weight.value||70); save(); alert('Profilo salvato');}}
function bindExerciseButtons(){app.querySelectorAll('.series button').forEach(btn=>btn.onclick=()=>{const dayId=btn.dataset.day, exIndex=Number(btn.dataset.ex), setIndex=Number(btn.dataset.set); const k=keyFor(dayId,exIndex,setIndex); state.series[k]=!state.series[k]; save(); renderHome();});}
function openGuide(dayId, exIndex){const day=DAYS.find(d=>d.id===dayId); if(!day || !day.exercises[exIndex]) return; state.guide={dayId, exIndex}; const ex=day.exercises[exIndex]; guideKicker=`${day.name.toUpperCase()} · Esercizio ${exIndex+1} di ${day.exercises.length}`; guideTitle.textContent=ex[0]; guideSub.textContent=ex[4]; const img=exImage(ex); const sets=parseSets(ex[1]); const completed=[...Array(sets)].filter((_,s)=>state.series[keyFor(day.id,exIndex,s)]).length; guideContent.innerHTML=`<div class="guide-hero">${img?spriteBox(img,'guide-art'):`<div class="placeholder">Immagine start/end in arrivo</div>`}</div><div class="guide-grid"><div class="stat"><b>${ex[1]}</b><span>SERIE</span></div><div class="stat"><b>${ex[2]}</b><span>RIPETIZIONI</span></div><div class="stat"><b>${ex[3]}</b><span>RECUPERO</span></div></div><div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b>Serie completate</b><span>${completed} / ${sets}</span></div><div class="series" style="margin-top:12px">${[...Array(sets)].map((_,s)=>`<button class="${state.series[keyFor(day.id,exIndex,s)]?'done':''}" data-guide-set="${s}">Serie ${s+1}</button>`).join('')}</div></div><button class="big-btn" id="completeSetBtn">COMPLETA PROSSIMA SERIE</button><div class="secondary-row"><button class="btn btn-secondary" id="prevEx">← Esercizio precedente</button><button class="btn btn-secondary" id="nextEx">Esercizio successivo →</button></div>`; guideOverlay.classList.add('show'); document.querySelectorAll('[data-guide-set]').forEach(b=>b.onclick=()=>toggleGuideSet(day.id,exIndex,Number(b.dataset.guideSet), true)); document.getElementById('completeSetBtn').onclick=()=>{let nextSet=[...Array(sets).keys()].find(s=>!state.series[keyFor(day.id,exIndex,s)]); if(nextSet===undefined) nextSet=sets-1; toggleGuideSet(day.id, exIndex, nextSet, true);}; document.getElementById('prevEx').onclick=()=>openGuide(dayId, Math.max(0, exIndex-1)); document.getElementById('nextEx').onclick=()=>openGuide(dayId, Math.min(day.exercises.length-1, exIndex+1));}
function toggleGuideSet(dayId, exIndex, setIndex, fromGuide=false){const day=DAYS.find(d=>d.id===dayId); const ex=day.exercises[exIndex]; const k=keyFor(dayId, exIndex, setIndex); const wasDone=!!state.series[k]; state.series[k]=!state.series[k]; save(); if(!wasDone && ex[3] && ex[3]!=='0 sec'){const sec=restToSec(ex[3]); if(sec>0) startTimer(sec, ex[0], dayId, exIndex);} if(fromGuide) openGuide(dayId, exIndex); else renderHome();}
function restToSec(txt){const m=String(txt).match(/(\d+)/); return m?Number(m[1]):0}
function startTimer(sec, exName, dayId, exIndex){timerPaused=false; timerRemaining=sec; timerEnd=Date.now()+sec*1000; pendingAdvance={dayId, exIndex}; timerExercise.textContent=exName; const day=DAYS.find(d=>d.id===dayId); const next=(day && day.exercises[exIndex+1])?day.exercises[exIndex+1][0]:'Fine allenamento'; timerNext.textContent=`Dopo il recupero: ${next}`; timerOverlay.classList.add('show'); tick(); clearInterval(timerInt); timerInt=setInterval(tick,250);}
function tick(){if(timerPaused) return; timerRemaining=Math.max(0, Math.ceil((timerEnd-Date.now())/1000)); const mm=String(Math.floor(timerRemaining/60)).padStart(2,'0'); const ss=String(timerRemaining%60).padStart(2,'0'); timerClock.textContent=`${mm}:${ss}`; if(timerRemaining<=0){clearInterval(timerInt); timerOverlay.classList.remove('show'); autoAdvance();}}
function autoAdvance(){if(!pendingAdvance) return; const {dayId, exIndex}=pendingAdvance; const day=DAYS.find(d=>d.id===dayId); if(state.guide && state.guide.dayId===dayId){ if(day.exercises[exIndex+1]) openGuide(dayId, exIndex+1); else { guideOverlay.classList.remove('show'); alert('Allenamento guidato completato. Ottimo lavoro!'); } } else render(); pendingAdvance=null;}
document.getElementById('guideClose').onclick=()=>guideOverlay.classList.remove('show');
document.getElementById('timerPause').onclick=()=>{timerPaused=!timerPaused; document.getElementById('timerPause').textContent=timerPaused?'Riprendi':'Pausa'; if(!timerPaused) timerEnd=Date.now()+timerRemaining*1000; tick();};
document.getElementById('timerSkip').onclick=()=>{clearInterval(timerInt); timerOverlay.classList.remove('show'); autoAdvance();};
document.querySelectorAll('.bottom-nav button').forEach(b=>b.onclick=()=>setRoute(b.dataset.route));
window.addEventListener('visibilitychange',()=>{if(!document.hidden && timerOverlay.classList.contains('show')) tick();});
function render(){if(state.route==='home') renderHome(); else if(state.route==='week') renderWeek(); else if(state.route==='progress') renderProgress(); else renderProfile();}
render();

</script>
</body></html>
